spring.application.name=engineering-workbench
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/workbench;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jackson.serialization.indent-output=true
server.error.include-message=never
server.tomcat.max-http-form-post-size=1MB
workbench.storage=./data/workspaces
workbench.max-runs=100
workbench.command-timeout-seconds=30
logging.level.dev.pranav.workbench=INFO
