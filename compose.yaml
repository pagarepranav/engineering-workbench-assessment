services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/workbench
      DB_USER: workbench
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/app/data
volumes:
  postgres-data:
  app-data:
